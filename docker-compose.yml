services:
  la_verde_alaboudi:
    build: .
    container_name: la_verde_alaboudi_app
    ports:
      - "${PORT:-8091}:5007"
    environment:
      - PORT=8091
      - THIS_BRANCH_KEY=al_aboudi
      - THIS_BRANCH_NAME=فرع العبودي
      - OTHER_BRANCH_NAME=فرع المسلة
      - OTHER_CONTAINER=la_verde_almasala_app
      - OTHER_PORT=8090
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./exports:/app/exports
    networks:
      - la_verde_net
    restart: unless-stopped

networks:
  la_verde_net:
    external: true
