services:
  la_verde_alaboudi:
    build: .
    container_name: la_verde_alaboudi_app
    ports:
      - "${PORT:-8091}:5007"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./exports:/app/exports
    networks:
      - la_verde_net
    restart: unless-stopped

networks:
  la_verde_net:
    name: la_verde_net
    driver: bridge
