services:
  la_verde_almasala:
    build: .
    container_name: la_verde_almasala_app
    ports:
      - "${PORT:-8090}:5007"
    environment:
      - PORT=8090
      - THIS_BRANCH_KEY=al_masala
      - THIS_BRANCH_NAME=فرع المسلة
      - OTHER_BRANCH_NAME=فرع العبودي
      - OTHER_CONTAINER=la_verde_alaboudi_app
      - OTHER_PORT=8091
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./exports:/app/exports
    networks:
      - la_verde_net
    restart: unless-stopped

networks:
  la_verde_net:
    name: la_verde_net
    external: true
